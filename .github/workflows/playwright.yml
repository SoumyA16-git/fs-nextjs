name: End-to-End Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Set up environment file
        run: |
          DB_URL="${{ secrets.DATABASE_URL }}"
          if [ -z "$DB_URL" ]; then
            DB_URL="postgresql://postgres:postgres@localhost:5432/test_db?sslmode=disable"
          fi
          AUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}"
          if [ -z "$AUTH_SECRET" ]; then
            AUTH_SECRET="test_nextauth_secret_key_123456789"
          fi
          AUTH_URL="${{ secrets.NEXTAUTH_URL }}"
          if [ -z "$AUTH_URL" ]; then
            AUTH_URL="http://localhost:3000"
          fi
          echo "DATABASE_URL=$DB_URL" > .env.test
          echo "NEXTAUTH_SECRET=$AUTH_SECRET" >> .env.test
          echo "NEXTAUTH_URL=$AUTH_URL" >> .env.test
          echo "NODE_ENV=test" >> .env.test

      - name: Verify environment setup
        run: |
          echo "Checking .env.test file:"
          cat .env.test | sed 's/=.*/=***/'
          echo ""
          if grep -q "DATABASE_URL=" .env.test; then
            echo "DATABASE_URL found in .env.test"
          else
            echo "DATABASE_URL NOT found in .env.test"
          fi

      - name: Run database migrations
        run: npx drizzle-kit push

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
